name: BatteryScope
options:
  bundleIdPrefix: com.batteryscope
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    DEAD_CODE_STRIPPING: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BatteryScope:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: BatteryScope
        excludes:
          - "Info.plist"
          - "BatteryScope.entitlements"
    entitlements:
      path: BatteryScope/BatteryScope.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.batteryscope.app
        INFOPLIST_FILE: BatteryScope/Info.plist
        CODE_SIGN_ENTITLEMENTS: BatteryScope/BatteryScope.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
